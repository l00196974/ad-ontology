# ad-intelligence-crawler 默认配置
# 可通过 CLI 参数覆盖，优先级：CLI 参数 > 环境变量 > 本文件

# 默认搜索引擎: exa
DEFAULT_ENGINE="exa"

# 默认最大结果数
DEFAULT_MAX_RESULTS=20

# 默认时间范围: day / week / month / year
DEFAULT_TIME_RANGE="week"

# 是否包含图片 (true/false)
DEFAULT_INCLUDE_IMAGES="true"

# 默认域名白名单（空格分隔，留空则不限制 — 依赖 Exa 语义搜索能力）
DEFAULT_INCLUDE_DOMAINS=""

# 默认域名黑名单（空格分隔）
DEFAULT_EXCLUDE_DOMAINS=""
