# ad-intelligence-crawler 默认配置
# 可通过 CLI 参数覆盖，优先级：CLI 参数 > 环境变量 > 本文件

# 默认搜索引擎: exa 或 tavily
DEFAULT_ENGINE="exa"

# 默认最大结果数
DEFAULT_MAX_RESULTS=10

# 默认时间范围: day / week / month / year
DEFAULT_TIME_RANGE="week"

# 是否包含图片 (true/false)
DEFAULT_INCLUDE_IMAGES="true"

# 默认域名白名单（空格分隔，留空则不限制）
# 广告资讯：adweek / marketingweek / warc / 胜三
# 中文媒体：adquan / meihua / socialbeta
DEFAULT_INCLUDE_DOMAINS="oceanengine.com partner.oceanengine.com bytedance.feishu.cn ad.qq.com support.e.qq.com e.qq.com dev2.baidu.com open.kuaishou.com adquan.com digitaling.com .cn huxiu.com 36kr.com juejin.cn blog.csdn.netdataeye.com reyun.com newrank.cn github.com google.com facebook.com amazon.com ads.tiktok.com adexchanger.com marketingland.com martech.orgmedium.com similarweb.com appannie.com sensortower.com stackoverflow.com oschina.netinfoq.cn segmentfault.com 51cto.com jiqizhixin.com ycombinator.com dzone.com techcrunch.com technologyreview.com"

# 默认域名黑名单（空格分隔）
DEFAULT_EXCLUDE_DOMAINS="reddit.com quora.com stackexchange.com"
