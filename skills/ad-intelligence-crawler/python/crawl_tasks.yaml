# crawl4ai_fetcher 抓取任务配置
#
# 用法：python __main__.py --config crawl_tasks.yaml
#
# 支持四种抓取模式：
#   1. 直接模式：指定文章 URL（urls 字段）
#   2. 列表页模式：指定列表页 URL，自动发现文章链接（listing_urls 字段）
#   3. 混合模式：同时使用 urls 和 listing_urls
#   4. 微信公众号模式：指定公众号名称/fakeid，自动获取文章列表（wechat_accounts 字段）
#
# 列表页引擎选择：
#   - SPA 页面（React/Vue 等）→ 用 crawl4ai 或 scrapling/stealthy/dynamic（需 JS 渲染）
#   - 服务端渲染页面（SSR）  → 用 scrapling/async（最快，无需浏览器）
#
# 微信公众号引擎：
#   - 需设置环境变量 WECHAT_COOKIE 和 WECHAT_TOKEN
#   - 获取方式：登录 mp.weixin.qq.com → 浏览器 F12 → Network → 找请求的 cookie 和 token

db_path: "articles.db"

tasks:
  # ============================================================
  # 两阶段抓取：列表页发现 → 文章内容抓取
  # scrapling/async 快速抓列表页提取链接 → crawl4ai 抓文章内容
  # ============================================================
  - name: "infoq-cn-latest"
    engine: scrapling
    fetcher_type: async
    listing_urls:
      - https://www.infoq.cn/
    max_articles: 5
    article_engine: crawl4ai
    article_options:
      threshold: 0.3
      timeout: 60
      concurrent: 3
    options:
      timeout: 15

  # ============================================================
  # 直接 URL 模式（36kr 有验证码反爬，列表页无法自动抓取，
  # 但已知文章 URL 可通过 crawl4ai 直接抓取）
  # ============================================================
  # - name: "36kr-specific"
  #   engine: crawl4ai
  #   urls:
  #     - https://www.36kr.com/p/1724501557249
  #   options:
  #     threshold: 0.3
  #     timeout: 30

  # ============================================================
  # crawl4ai 直接抓取（Playwright 浏览器，兼容性好）
  # ============================================================
  # - name: "google-ads-blog"
  #   engine: crawl4ai
  #   urls:
  #     - https://blog.google/products/ads/
  #   options:
  #     threshold: 0.3
  #     timeout: 30

  # ============================================================
  # 带正则过滤的列表页抓取（取消注释使用）
  # ============================================================
  # - name: "adexchanger-articles"
  #   engine: scrapling
  #   fetcher_type: async
  #   listing_urls:
  #     - https://www.adexchanger.com/
  #   max_articles: 15
  #   link_pattern: "/\\d{4}/\\d{2}/\\d{2}/"  # 匹配日期路径
  #   article_engine: crawl4ai

  # ============================================================
  # 混合模式：列表页发现 + 指定 URL
  # ============================================================
  # - name: "mixed-sources"
  #   engine: scrapling
  #   fetcher_type: async
  #   listing_urls:
  #     - https://36kr.com/information/web_news
  #   urls:
  #     - https://www.36kr.com/p/specific-article
  #   max_articles: 10
  #   article_engine: crawl4ai

  # ============================================================
  # 微信公众号模式
  # 需设置环境变量：WECHAT_COOKIE、WECHAT_TOKEN
  # ============================================================
  # - name: "wechat-tech-accounts"
  #   engine: wechat
  #   wechat_accounts:
  #     - "36氪"                      # 公众号名称（自动搜索 fakeid）
  #     # - "MzI2NTAx..."            # 或直接用 fakeid
  #   wechat_options:
  #     delay: 3                      # 请求间隔 3 秒，避免频率限制
  #     count: 5                      # 每页 5 篇文章
  #     max_pages: 2                  # 最多翻 2 页 = 10 篇文章
  #   # 可选：文章内容用 crawl4ai 抓取（Markdown 质量可能更好）
  #   # article_engine: crawl4ai
  #   # article_options:
  #   #   threshold: 0.3
  #   #   timeout: 60
