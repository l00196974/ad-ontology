services:
  graphdb:
    image: ontotext/graphdb:10.7.4
    container_name: auto-marketing-graphdb
    ports:
      - "7200:7200"
    volumes:
      - graphdb_data:/opt/graphdb/home
      - ./graphdb-init:/opt/graphdb/home/graphdb-init
    environment:
      GDB_HEAP_SIZE: "2g"
      GDB_MIN_MEM: "512m"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7200/rest/repositories"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  graphdb_data:
