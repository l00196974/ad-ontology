llm_pool:
  stream: true
  timeout_seconds: 30
  temperature: 0.1
  max_tokens: 500
  resources:
    - name: "minimax-m2-1-a"
      base_url: "https://api.minimaxi.com/v1"
      model: "MiniMax-M2.1"
      api_key: "YOUR_API_KEY_A"
    - name: "minimax-m2-1-b"
      base_url: "https://api.minimaxi.com/v1"
      model: "MiniMax-M2.1"
      api_key: "YOUR_API_KEY_B"

pipeline:
  input_csv: "input.csv"
  output_csv: "output.csv"
  prompt_template: "automotive_intent_with_score"  # Name of prompt template in prompts/ directory
  max_concurrency: 8
  max_retries: 2
  retry_backoff_seconds: 1.5
  realtime_flush: true
  resume_mode: true
  resume_key_column: "did"  # Must exist in prompt template's required_columns

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
