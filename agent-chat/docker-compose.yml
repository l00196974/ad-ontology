version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: huawei-ads-backend
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=production
      - PORT=3100
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-claude}
      - CLAUDE_BASE_URL=${CLAUDE_BASE_URL:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
    volumes:
      - ./data/sessions:/app/.sessions
      - ./data/users:/app/.users
      - ../skills:/app/skills:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3100/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - huawei-ads-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: huawei-ads-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - huawei-ads-network

volumes:
  sessions-data:
  users-data:

networks:
  huawei-ads-network:
    driver: bridge
